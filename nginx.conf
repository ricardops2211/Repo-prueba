# Config completa (nginx.conf completo) porque lo montaremos reemplazando el default
worker_processes  1;

events { worker_connections 1024; }

http {
  # Upstream: nombre del servicio docker-compose (java-ms) + puerto interno 8080
  upstream java_upstream {
    server java-ms:8080;
  }

  server {
    listen 80;

    # Proxy de todo hacia el microservicio Java
    location / {
      proxy_pass http://java_upstream;

      # Headers típicos (buena práctica)
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
