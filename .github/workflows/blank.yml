name: Actions-Docker_compose_lunes

on:
  push:
    branches:
      - docker-ops
  pull_request:

jobs:
  docker-compose:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Verificar Docker y Compose
      - name: Docker version
        run: |
          docker --version
          docker compose version

      # 4️⃣ Build de los servicios
      - name: Build services
        run: docker compose build

      # 5️⃣ Levantar entorno
      - name: Start services
        run: docker compose up -d

      # 6️⃣ Esperar servicios
      - name: Wait for backend
        run: |
          sleep 15
          docker compose ps

      # 7️⃣ Tests (ejemplo simple)
      - name: Run tests
        run: |
          docker compose exec -T backend python -c "print('Tests OK')"

      # 8️⃣ Apagar servicios
      - name: Stop services
        if: always()
        run: docker compose down -v
