# This is a basic workflow to help you get started with Actions

name: CIASD

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "python_hashicorp_matrix" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip

      - name: Build matrix from json
        id: build-matrix
        run: |
          MATRIX=$(python3 create_secrets.py)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  vault-job:
    needs: generate-matrix
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vault CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSL https://releases.hashicorp.com/vault/1.18.1/vault_1.18.1_linux_amd64.zip -o vault.zip
          unzip vault.zip
          sudo mv vault /usr/local/bin/
          vault --version

      - name: Start Vault DEV server
        run: |
          export VAULT_DEV_ROOT_TOKEN_ID=my-dev-token
          nohup vault server -dev -dev-root-token-id="my-dev-token" > vault.log 2>&1 &
          sleep 3

      - name: Set Vault env
        run: |
          echo "VAULT_ADDR=http://127.0.0.1:8200" >> $GITHUB_ENV
          echo "VAULT_TOKEN=my-dev-token" >> $GITHUB_ENV

      - name: Create secret in Vault
        run: |
          echo "Creando secreto en: ${{ matrix.path }}"
          vault kv put \
            ${{ matrix.path }} \
            username=${{ matrix.username }} \
            password=${{ matrix.password }}

      - name: List secrets root
        run: |
          echo "Listando rutas en 'secret/'"
          vault kv list secret/

      - name: Read created secret
        run: |
          echo "Leyendo secreto: ${{ matrix.path }}"
          vault kv get ${{ matrix.path }}
