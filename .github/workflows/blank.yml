name: Upload Artifact Even Without Node

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Este paso solo crea un archivo de ejemplo, sin npm
      - name: Crear artefacto de prueba
        run: |
          mkdir -p output
          echo "Hola, este es un artefacto de prueba" > output/hello.txt

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: prueba-artifact
          path: output
          if-no-files-found: warn
