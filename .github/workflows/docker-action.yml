name: Docker con microservicios en Java

on:
  push:
    branches: ["main", "master"]   # # corre cuando haces push a main/master
  pull_request:
    branches: ["main", "master"]   # # corre en PRs hacia main/master
  workflow_dispatch:              # # botón manual para ejecutarlo

jobs:
  build_run_test:
    runs-on: ubuntu-latest         # # runner GitHub-hosted (de GitHub)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  # # descarga tu código al runner

      - name: Show Docker/Compose versions
        run: |
          # # solo para verificar que docker y compose existen
          docker version
          docker compose version

      - name: Build and start services (compose)
        run: |
          # # construye la imagen java-ms y levanta java-ms + nginx en background
          docker compose up -d --build

      - name: Smoke test via Nginx (reintentos)
        run: |
          # # esperamos a que nginx/java estén listos y probamos /health y /api/hello
          set -e
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "✅ /health OK"
              break
            fi
            sleep 1
          done

          echo "Response /health:"
          curl -fsS http://localhost:8080/health
          echo

          echo "Response /api/hello:"
          curl -fsS http://localhost:8080/api/hello
          echo

      - name: Logs (if needed)
        if: always()
        run: |
          # # imprime logs para debug aunque falle algo
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Shutdown
        if: always()
        run: |
          # # baja contenedores para no dejar basura en el runner
          docker compose down
